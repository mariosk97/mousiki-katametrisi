
<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Μουσική καταμέτρηση</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="container">

        <header>
            <h1>🎵 Μουσική καταμέτρηση</h1>
            <p>Μέτρησε τα όργανα και άκου τη μουσική!</p>
        </header>

        <!-- Αρχικό μενού -->
        <section id="menu" class="panel">
            <h2>Επίλεξε παιχνίδι</h2>

            <button class="mode-button" onclick="startGame(1)">
                🎸 Μέτρησε τα μπουζούκια
            </button>

            <button class="mode-button" onclick="startGame(2)">
                🎼 Μέτρησε μόνο τα μπουζούκια
            </button>

            <h2>Επίπεδο δυσκολίας</h2>

            <div class="levels">
                <button onclick="selectLevel(1)" id="level1">
                    Επίπεδο 1<br>
                    <small>1–4 όργανα</small>
                </button>

                <button onclick="selectLevel(2)" id="level2">
                    Επίπεδο 2<br>
                    <small>2–6 όργανα</small>
                </button>

                <button onclick="selectLevel(3)" id="level3">
                    Επίπεδο 3<br>
                    <small>3–9 όργανα</small>
                </button>
            </div>

            <p id="menuMessage">Επίλεξε επίπεδο και παιχνίδι.</p>
        </section>

        <!-- Οθόνη παιχνιδιού -->
        <section id="game" class="panel hidden">

            <div class="game-top">
                <button class="back-button" onclick="goToMenu()">
                    ← Μενού
                </button>

                <span id="roundInfo">Γύρος 1</span>
            </div>

            <h2 id="gameTitle"></h2>
            <p id="instruction"></p>

            <div id="instrumentArea" class="instrument-area"></div>

            <div class="answer-area">
                <label for="answer">Πόσα μπουζούκια υπάρχουν;</label>

                <input
                    id="answer"
                    type="text"
                    inputmode="numeric"
                    maxlength="1"
                    placeholder="?"
                    autocomplete="off"
                >

                <button id="submitButton" onclick="checkAnswer()">
                    Υποβολή
                </button>
            </div>

            <p id="feedback" aria-live="polite"></p>

            <button id="nextButton" class="next-button hidden"
                    onclick="nextRound()">
                Επόμενος γύρος →
            </button>

        </section>

    </main>

    <script src="script.js"></script>
</body>
</html>
